# Weekly pull requests to keep dependencies up to date, grouped so there's one PR per ecosystem instead of dozens.
# Security fixes arrive as soon as a vulnerability is published, whatever the schedule.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    groups:
      backend:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      storefront:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /qa
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
