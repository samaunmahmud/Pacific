spring:
  application:
    name: pacific-marketplace
  servlet:
    multipart:
      # A little above app.uploads.max-bytes, so an oversized photo gets the shop's own message rather than a bare 413.
      max-file-size: 12MB
      max-request-size: 12MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pacific_marketplace?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:pacific}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          # Store Instants as plain DATETIME(6) (in UTC) so schema validation matches MySQL and H2.
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    # Must be at least 32 characters. There is deliberately no default: set JWT_SECRET.
    secret: ${JWT_SECRET}
    expiry-hours: 12
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  reviews:
    # Customers can edit/delete their own review for this many minutes after posting.
    edit-window-minutes: 5
  shop:
    currency: GBP
    shipping-flat-rate: 3.99
    free-shipping-threshold: 50.00
    max-quantity-per-item: 10
    # Customers can ask to return delivered items for this many days after delivery.
    return-window-days: 30
    # Delivery dates: business days after the seller dispatches (sellers choose how long that takes). Orders placed
    # before the cut-off hour on a business day count from that day.
    express-rate: 5.99
    standard-days-min: 2
    standard-days-max: 3
    express-days: 1
    dispatch-cutoff-hour: 14
    time-zone: Europe/London
  # Where the storefront is served from; used to build links in payment redirects and emails.
  public-url: ${PUBLIC_URL:http://localhost:5173}
  payments:
    # Unpaid card orders are cancelled (and their stock released) after this long. Stripe needs at least 30 minutes.
    pending-expiry-minutes: 35
    expiry-job: true
    stripe:
      # Leave the secret key empty to disable Stripe. Never commit real keys: set them as environment variables.
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      api-base: ${STRIPE_API_BASE:}
    # A fake, clearly labelled test-mode payment page for local development. NEVER enable in production.
    simulator-enabled: ${PAYMENTS_SIMULATOR_ENABLED:false}
  security:
    # A password reset link works for this long.
    reset-token-minutes: 60
    # A link confirming a new customer's email address works for this long.
    verify-token-hours: 48
    # Wrong passwords allowed within the window: per account from one address, and across accounts from one address.
    login-max-failures: 5
    login-window-minutes: 15
    ip-max-failures: 50
    # Set APP_PRODUCTION=true on a real shop: the app then refuses to start with the payment simulator, demo data,
    # a non-https PUBLIC_URL or localhost CORS origins.
    production: ${APP_PRODUCTION:false}
  # Order emails. With MAIL_HOST set they go out over SMTP (see spring.mail below); without it they are only logged and
  # recorded in the sent_emails table, so development never sends a real email by accident.
  mail:
    from: ${MAIL_FROM:Pacific <no-reply@pacific.example>}
    async: true
  # Development only: fills an empty shop with ~150 invented products, stores, shoppers and reviews (DEMO_DATA=true).
  # Adds data once, never touches yours, and creates a demo shopper account. NEVER enable against a real shop.
  demo-data:
    enabled: ${DEMO_DATA:false}
  # Product photos uploaded by sellers and admins. Keep UPLOADS_DIR on a disk that survives redeploys (and back it up).
  uploads:
    dir: ${UPLOADS_DIR:./uploads}
    max-bytes: 10485760
    # Photos are re-saved no larger than this on their longer side (which also removes location data from phone photos).
    max-dimension: 1600
    hourly-limit: 60
  # Optional: creates this admin at startup if no admin exists yet (fresh installs).
  admin-bootstrap:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
  # One-off import of the old JavaFX app's SQLite database. Set to the path of DataBase1.db.
  legacy-import:
    sqlite-path: ${LEGACY_SQLITE_PATH:}
    default-stock: 50
